<!DOCTYPE html>
<html>

<head>
  <title>WHO AM I, Augmented Reality edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AR app built at BEST Hackathon 2021">
  <meta property="og:title" content="WHO AM I, Augmented Reality edition">
  <meta property="og:description" content="AR app built at BEST Hackathon 2021">
  <meta property="og:image" content="/whoami-ar/banner.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="https://strdr4605.github.io/whoami-ar" />
  <meta name="twitter:creator" content="@strdr4605" />
  <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script type="module" crossorigin src="/whoami-ar/assets/index-CbBg761J.js"></script>
  <link rel="stylesheet" crossorigin href="/whoami-ar/assets/index-tFbe_eB2.css">
</head>

<body style="margin : 0px; overflow: hidden;">
  <a-scene
    id="ar-scene"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >
    <a-marker preset="hiro">
      <a-entity position="0 -1 0" scale="0.05 0.05 0.05" gltf-model="trex/scene.gltf"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <div id="root"></div>
</body>

</html>
